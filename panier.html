<!DOCTYPE html>
<html class="light" lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mon Panier — Racines & Rituels</title>
  <meta name="description" content="Retrouvez vos produits naturels : Khamaré, Hibiscus et coffrets bien-être dans votre panier. Paiement sécurisé et livraison rapide.">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/tailwind-cdn-config.js"></script>

  <!-- Polices -->
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <style>
    body {
      font-family: "Epilogue", sans-serif;
    }
  </style>
</head>

<body class="bg-beige dark:bg-background-dark text-gray-800 dark:text-white">

  <div class="min-h-screen flex flex-col">

    <div id="site-header"></div>

    <div class="h-[70px]"></div>

    <!-- 🧺 CONTENU PANIER -->
    <main class="flex-1 p-4 max-w-2xl mx-auto w-full space-y-6">

      <h1 class="text-3xl font-bold text-center mb-4">Mon Panier</h1>

      <!-- 🧊 Liste dynamique -->
      <div id="cartItems" class="space-y-4"></div>

      <!-- Si panier vide -->
      <div id="emptyCart" class="hidden text-center py-20 text-gray-600 dark:text-gray-400">
        <p class="text-lg">Votre panier est vide 🧺</p>
        <a href="produits.html" class="text-primary font-semibold underline mt-2 inline-block">Voir les produits</a>
      </div>

      <!-- 🧮 RÉCAP TOTAL -->
      <div id="cartSummary" class="hidden p-4 bg-white dark:bg-background-dark/40 rounded-xl shadow space-y-3">

        <div class="flex justify-between">
          <span>Sous-total</span>
          <span id="subtotal">0 €</span>
        </div>

        <hr class="border-gray-300 dark:border-gray-700">

        <div class="flex justify-between font-bold text-lg">
          <span>Total</span>
          <span id="total">0 €</span>
        </div>

        <div class="flex gap-3 pt-4">
          <a href="produits.html" class="flex-1 h-12 flex items-center justify-center rounded-xl bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white font-bold hover:bg-gray-300 dark:hover:bg-gray-600 transition">
            Continuer mes achats
          </a>
          <button id="clearCartBtn" class="flex-1 h-12 rounded-xl bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 font-bold hover:bg-red-200 dark:hover:bg-red-900/50 transition">
            Vider le panier
          </button>
        </div>

        <!-- Error message -->
        <p id="payError" class="hidden text-red-600 dark:text-red-400 text-sm px-4 py-2 bg-red-50 dark:bg-red-900/20 rounded-lg"></p>

        <!-- Pay button (Stripe Checkout) -->
        <button id="payBtn" class="block w-full h-14 rounded-full bg-primary text-white text-lg font-bold hover:bg-primary/90 transition">
          Payer avec Stripe
        </button>

      </div>

    </main>

  <script src="/js/config.js"></script>
  <script type="module" src="js/header-loader.js"></script>

  </div>

  <!-- 📌 CHARGEMENT DU PANIER -->
  <script type="module">
    import { getCart, removeFromCart, updateQuantity, clearCart, getTotals, normalizeCartIds, isUUID } from "./js/cart.js";
    import { BACKEND_URL } from "./js/backend-config.js";

    const cartItemsEl = document.getElementById("cartItems");
    const emptyCartEl = document.getElementById("emptyCart");
    const summaryEl = document.getElementById("cartSummary");
    const clearCartBtn = document.getElementById("clearCartBtn");
    const payBtn = document.getElementById("payBtn");
    const payError = document.getElementById("payError");

    const IS_DEV = window.location.hostname === "127.0.0.1";

    async function loadCart() {
      const { cart, invalidItems } = await normalizeCartIds();

      cartItemsEl.innerHTML = "";

      if (!cart || cart.length === 0) {
        emptyCartEl.classList.remove("hidden");
        summaryEl.classList.add("hidden");
        payError.classList.add("hidden");
        payError.textContent = "";
        return;
      }

      emptyCartEl.classList.add("hidden");
      summaryEl.classList.remove("hidden");

      if (invalidItems.length > 0) {
        payError.textContent = "Produit introuvable, veuillez le retirer du panier.";
        payError.classList.remove("hidden");
        payBtn.disabled = true;
      } else {
        payError.classList.add("hidden");
        payError.textContent = "";
        payBtn.disabled = false;
      }

      let subtotal = 0;

      cart.forEach(item => {
        subtotal += item.price * (item.quantity || item.qty || 0);

        const div = document.createElement("div");
        div.className = "flex gap-4 bg-white dark:bg-background-dark/40 p-4 rounded-xl shadow";

        div.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/70'}" class="size-[70px] rounded-lg object-cover" onerror="this.src='https://via.placeholder.com/70'">

          <div class="flex flex-col justify-between flex-1">
            <p class="font-medium">${item.name}${item._invalid ? " (introuvable)" : ""}</p>
            <p class="text-sm">${Number(item.price || 0).toFixed(2)} €</p>
          </div>

          <div class="flex flex-col justify-between items-end">

            <button data-id="${item.id}" class="deleteBtn text-red-600 hover:text-red-800">
              <span class="material-symbols-outlined text-xl">delete</span>
            </button>

            <div class="flex items-center gap-2">
              <button data-id="${item.id}" class="minusBtn h-7 w-7 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600">−</button>
              <span class="w-8 text-center">${item.quantity || item.qty || 1}</span>
              <button data-id="${item.id}" class="plusBtn h-7 w-7 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600">+</button>
            </div>

          </div>
        `;

        cartItemsEl.appendChild(div);
      });

      const totals = await getTotals();
      document.getElementById("subtotal").textContent = Number(totals.total || subtotal).toFixed(2) + " €";
      document.getElementById("total").textContent = Number(totals.total || subtotal).toFixed(2) + " €";

      enableButtons();
    }

    function enableButtons() {
      document.querySelectorAll(".deleteBtn").forEach(btn => {
        btn.onclick = async () => {
          await removeFromCart(btn.dataset.id);
          loadCart();
        };
      });

      document.querySelectorAll(".plusBtn").forEach(btn => {
        btn.onclick = async () => {
          await updateQuantity(btn.dataset.id, +1);
          loadCart();
        };
      });

      document.querySelectorAll(".minusBtn").forEach(btn => {
        btn.onclick = async () => {
          await updateQuantity(btn.dataset.id, -1);
          loadCart();
        };
      });
    }

    clearCartBtn.addEventListener("click", async () => {
      if (confirm("Êtes-vous sûr de vouloir vider votre panier ?")) {
        await clearCart();
        loadCart();
      }
    });

    // ===== STRIPE CHECKOUT HANDLER (CLEAN: only call backend) =====
    // Strict flow: frontend is Stripe-agnostic and only calls our backend
    payBtn.addEventListener("click", async () => {
      // Generic error message only (no Stripe errors shown to user)
      const GENERIC_ERROR = "Une erreur est survenue lors du paiement. Veuillez réessayer.";

      // disable and show minimal state
      payError.classList.add("hidden");
      payError.textContent = "";
      payBtn.disabled = true;
      const originalText = payBtn.textContent;
      payBtn.textContent = "Redirection…";

      try {
        const { cart, invalidItems } = await normalizeCartIds();
        if (!cart || cart.length === 0) {
          payError.textContent = "Votre panier est vide.";
          payError.classList.remove("hidden");
          payBtn.disabled = false;
          payBtn.textContent = originalText;
          return;
        }

        if (invalidItems.length > 0) {
          payError.textContent = "Produit introuvable, veuillez le retirer du panier.";
          payError.classList.remove("hidden");
          payBtn.disabled = false;
          payBtn.textContent = originalText;
          return;
        }

        const items = cart.map(item => {
          const rawId = typeof item.id === "string" ? item.id.trim() : "";
          const rawSlug = typeof item.slug === "string" && item.slug.trim()
            ? item.slug.trim()
            : (typeof item.product_slug === "string" && item.product_slug.trim() ? item.product_slug.trim() : "");
          const quantity = Number(item.quantity ?? item.qty ?? 1);

          const entry = { quantity };
          if (rawId && isUUID(rawId)) {
            entry.product_id = rawId;
          } else if (rawSlug) {
            entry.product_slug = rawSlug;
          }
          return entry;
        });

        for (const it of items) {
          if (!Number.isInteger(it.quantity) || it.quantity < 1 || it.quantity > 99) {
            payError.textContent = "Quantité invalide (1-99).";
            payError.classList.remove("hidden");
            payBtn.disabled = false;
            payBtn.textContent = originalText;
            return;
          }

          const hasId = typeof it.product_id === "string" && it.product_id.length > 0;
          const hasSlug = typeof it.product_slug === "string" && it.product_slug.length > 0;
          if (!hasId && !hasSlug) {
            payError.textContent = "Produit introuvable ou identifiant manquant.";
            payError.classList.remove("hidden");
            payBtn.disabled = false;
            payBtn.textContent = originalText;
            return;
          }
        }

        const payload = { items };
        if (IS_DEV) {
          console.log("[checkout] payload ->", payload);
        }

        const backend = BACKEND_URL || (window.__ENV__ && window.__ENV__.BACKEND_URL);
        if (!backend) {
          throw new Error("BACKEND_URL non défini dans config.js");
        }

        const resp = await fetch(`${backend}/create-checkout-session`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          const cid = data && data.correlation_id ? ` (corr=${data.correlation_id})` : "";
          const serverMsg = (data && data.message) || (data && data.error) || GENERIC_ERROR;
          throw new Error(`${serverMsg}${cid}`);
        }

        const data = await resp.json();
        if (data && data.url) {
          window.location.href = data.url;
          return;
        }

        throw new Error(GENERIC_ERROR);
      } catch (err) {
        console.error('Checkout frontend error (generic to user):', err);
        payError.textContent = err.message || GENERIC_ERROR;
        payError.classList.remove('hidden');
        payBtn.disabled = false;
        payBtn.textContent = originalText;
      }
    });

    loadCart();
  </script>

  <div id="site-footer"></div>
  <script type="module" src="js/footer-loader.js"></script>

</body>
</html>
