<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commande annulée – Racines & Rituels</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <style>
    body { background: #f7f7f7; }
    main.container { max-width: 720px; margin-top: 48px; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <main class="container">
    <h1>Commande annulée</h1>
    <article class="card">
      <p>Votre paiement a été interrompu ou annulé. Aucun débit n'a été effectué.</p>
      <p>Vous pouvez réessayer ou contacter le support si besoin.</p>
      <div style="display:flex; gap:12px; flex-wrap: wrap; margin-top: 12px;">
        <a href="/" role="button" class="contrast">Retour à la boutique</a>
        <a href="mailto:support@racinesetrituels.local" role="button" class="secondary">Contacter le support</a>
      </div>
    </article>
  </main>
</body>
</html>
