<!DOCTYPE html>
<html lang="fr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Déconnexion — Racines & Rituels</title>

  <!-- TailwindCSS -->
    <link rel="stylesheet" href="/public/css/tailwind.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&display=swap" rel="stylesheet"/>

  <style>
    body { font-family: 'Epilogue', sans-serif; }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center text-center">

  <div class="p-8 bg-white dark:bg-background-dark/40 rounded-xl shadow-md max-w-sm w-full">
    <h1 class="text-2xl font-bold mb-3">Déconnexion…</h1>
    <p class="text-gray-700 dark:text-gray-300">
      Vous allez être redirigé dans un instant.
    </p>
  </div>

  <!-- Script Supabase -->
  <script src="/public/js/config.js"></script>
  <script type="module">
    import { supabase } from "/public/js/supabase.js";

    // Déconnexion automatique à l’ouverture de la page
    async function logout() {
      await supabase.auth.signOut();

      // Redirection
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    }

    logout();
  </script>

</body>
</html>
