<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Commandes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const pwd = prompt("Mot de passe admin :");
    if (!pwd) window.location.replace("/index.html");
  </script>
  <style>
    body { font-family: sans-serif; }
    @media print {
      .no-print { display: none !important; }
      .order-card { page-break-inside: avoid; border: 1px solid #ccc; margin-bottom: 2rem; }
    }
  </style>
</head>
<body class="bg-gray-100 p-6">

  <div class="no-print mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Commandes — Racines & Rituels</h1>
    <div class="flex gap-3">
      <select id="filterStatus" class="border rounded px-3 py-2 text-sm">
        <option value="">Tous les statuts</option>
        <option value="paid" selected>Payées</option>
        <option value="pending">En attente</option>
      </select>
      <button onclick="window.print()" class="bg-black text-white px-4 py-2 rounded text-sm hover:bg-gray-800">
        🖨 Imprimer
      </button>
    </div>
  </div>

  <div id="loading" class="text-gray-500 text-center py-12">Chargement…</div>
  <div id="orders-list" class="space-y-6 hidden"></div>

  <script>
    const fmt = (cents) => typeof cents === 'number'
      ? (cents / 100).toFixed(2).replace('.', ',') + ' €'
      : '—';

    const fmtDate = (iso) => iso
      ? new Date(iso).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })
      : '—';

    function buildCard(order) {
      const items = order.order_items || [];
      const itemsHtml = items.length
        ? items.map(i => `
            <tr>
              <td class="py-1 pr-4">${i.products?.name || '—'}</td>
              <td class="py-1 pr-4 text-center">${i.qty}</td>
              <td class="py-1 text-right">${fmt(i.unit_sale_price_ttc_cents * i.qty)}</td>
            </tr>`).join('')
        : '<tr><td colspan="3" class="text-gray-400 italic py-1">Aucun article</td></tr>';

      const statusColor = order.status === 'paid'
        ? 'bg-green-100 text-green-800'
        : 'bg-yellow-100 text-yellow-800';

      return `
        <div class="order-card bg-white rounded-xl shadow p-6">
          <div class="flex items-start justify-between mb-4 flex-wrap gap-2">
            <div>
              <span class="text-xs text-gray-400 uppercase tracking-wide">Commande</span>
              <p class="font-mono text-sm text-gray-700">${order.id}</p>
              <p class="text-xs text-gray-400 mt-1">${fmtDate(order.created_at)}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusColor}">${order.status}</span>
          </div>

          <div class="grid md:grid-cols-2 gap-4 mb-4">
            <div>
              <p class="text-xs font-semibold text-gray-500 uppercase mb-1">Client</p>
              <p class="text-sm">${order.shipping_name || order.customer_email || '—'}</p>
              ${order.customer_email ? `<p class="text-sm text-gray-500">${order.customer_email}</p>` : ''}
            </div>
            <div>
              <p class="text-xs font-semibold text-gray-500 uppercase mb-1">Adresse de livraison</p>
              ${order.shipping_address1 ? `
                <p class="text-sm">${order.shipping_address1}</p>
                ${order.shipping_address2 ? `<p class="text-sm">${order.shipping_address2}</p>` : ''}
                <p class="text-sm">${order.shipping_postcode || ''} ${order.shipping_city || ''}</p>
                <p class="text-sm text-gray-500">${order.shipping_country || ''}</p>
              ` : '<p class="text-sm text-gray-400 italic">Non renseignée</p>'}
            </div>
          </div>

          <table class="w-full text-sm border-t pt-3">
            <thead>
              <tr class="text-left text-xs text-gray-500 uppercase">
                <th class="py-2 pr-4">Produit</th>
                <th class="py-2 pr-4 text-center">Qté</th>
                <th class="py-2 text-right">Sous-total</th>
              </tr>
            </thead>
            <tbody>${itemsHtml}</tbody>
            <tfoot>
              <tr class="border-t font-bold">
                <td colspan="2" class="pt-2">Total</td>
                <td class="pt-2 text-right">${fmt(order.total_ttc_cents)}</td>
              </tr>
            </tfoot>
          </table>
        </div>`;
    }

    async function load() {
      const resp = await fetch('/admin/orders', {
        headers: { 'X-Admin-Secret': pwd },
      });
      if (resp.status === 401) {
        alert('Mot de passe incorrect.');
        window.location.replace('/index.html');
        return;
      }
      const { orders } = await resp.json();

      document.getElementById('loading').classList.add('hidden');
      const list = document.getElementById('orders-list');
      list.classList.remove('hidden');

      const filterStatus = document.getElementById('filterStatus');

      function render() {
        const status = filterStatus.value;
        const filtered = status ? orders.filter(o => o.status === status) : orders;
        if (!filtered.length) {
          list.innerHTML = '<p class="text-gray-400 text-center py-8">Aucune commande.</p>';
          return;
        }
        list.innerHTML = filtered.map(buildCard).join('');
      }

      filterStatus.addEventListener('change', render);
      render();
    }

    load().catch(err => {
      document.getElementById('loading').textContent = 'Erreur : ' + err.message;
    });
  </script>

</body>
</html>
