<!DOCTYPE html>
<html lang="fr" class="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passer Commande | Racines & Rituels</title>
  <meta name="description" content="Finalisez votre commande de plantes naturelles – Khamaré, Hibiscus. Paiement sécurisé via Stripe.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="/public/css/tailwind.css">

  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

</head>

<body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
  <div id="site-header"></div>
  <main class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">Passer commande</h1>

    <div class="grid md:grid-cols-2 gap-6">
      <form id="checkoutForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">Prénom *</label>
          <input id="firstName" required class="mt-1 w-full h-12 px-4 rounded-lg border" />
        </div>
        <div>
          <label class="block text-sm font-medium">Nom *</label>
          <input id="lastName" required class="mt-1 w-full h-12 px-4 rounded-lg border" />
        </div>
        <div>
          <label class="block text-sm font-medium">Email *</label>
          <input id="email" type="email" required class="mt-1 w-full h-12 px-4 rounded-lg border" />
        </div>
        <div>
          <label class="block text-sm font-medium">Téléphone</label>
          <input id="phone" class="mt-1 w-full h-12 px-4 rounded-lg border" />
        </div>
        <div>
          <label class="block text-sm font-medium">Adresse</label>
          <input id="address" class="mt-1 w-full h-12 px-4 rounded-lg border" />
        </div>
        <div>
          <label class="block text-sm font-medium">Notes</label>
          <textarea id="notes" class="mt-1 w-full rounded-lg border p-3" rows="3"></textarea>
        </div>
        <div>
          <p id="payError" class="hidden text-red-600 text-sm mb-2"></p>
          <button id="payBtn" type="button"
            class="w-full h-12 bg-primary text-white rounded-lg font-bold">Payer</button>
        </div>
      </form>

      <aside class="bg-white dark:bg-background-dark/40 p-4 rounded-lg shadow">
        <h2 class="font-bold mb-3">Récapitulatif de la commande</h2>
        <div id="orderItems" class="space-y-2 max-h-64 overflow-auto"></div>
        <div class="flex justify-between font-bold mt-4">
          <span>Total</span>
          <span id="orderTotal">0 €</span>
        </div>
      </aside>
    </div>

    <div id="confirmation" class="hidden mt-6 p-4 bg-green-100 rounded-lg">
      <p class="font-bold">Commande enregistrée !</p>
      <p>Merci. <a href="/index.html" class="text-primary underline">Retour à l'accueil</a></p>
    </div>

  </main>

  <div id="site-footer"></div>
  <script src="/public/js/config.js"></script>
  <script type="module" src="/public/js/header-loader.js"></script>
  <script type="module" src="/public/js/footer-loader.js"></script>

  <script type="module">
    import { getCart, getTotals, clearCart, normalizeCartIds, isUUID } from '/public/js/cart.js';
    import { BACKEND_URL } from '/public/js/backend-config.js';

    async function renderSummary() {
      const items = await getCart();
      const totals = await getTotals();
      const container = document.getElementById('orderItems');
      container.innerHTML = '';
      items.forEach(it => {
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center';
        div.innerHTML = `<div><div class=\"font-medium\">${it.name}</div><div class=\"text-sm text-gray-500\">x${it.quantity} • ${it.price.toFixed(2)} €</div></div><div>${(it.price * it.quantity).toFixed(2)} €</div>`;
        container.appendChild(div);
      });
      document.getElementById('orderTotal').textContent = totals.total.toFixed(2) + ' €';
      return { items, totals };
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await renderSummary();

      // Replace local save behavior with Stripe Checkout redirect
      document.getElementById('payBtn').onclick = async (e) => {
        e.preventDefault();
        const payErrorEl = document.getElementById('payError');
        payErrorEl.classList.add('hidden');
        payErrorEl.textContent = '';

        // Basic customer validation (optional)
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        if (!firstName || !lastName || !email) {
          payErrorEl.textContent = 'Veuillez remplir les champs Prénom, Nom et Email.';
          payErrorEl.classList.remove('hidden');
          return;
        }

        // Disable button and show status
        const btn = document.getElementById('payBtn');
        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = 'Redirection…';

        try {
          const { cart: normalizedCart, invalidItems } = await normalizeCartIds();
          if (invalidItems.length > 0) {
            throw new Error('Un produit est introuvable, merci de le retirer du panier.');
          }

          if (!normalizedCart || normalizedCart.length === 0) {
            throw new Error('Votre panier est vide.');
          }

          const items = normalizedCart.map(it => {
            const str = v => typeof v === 'string' ? v.trim() : '';
            const uuidCandidate = [it.product_id, it.product_uuid, it.uuid, it.id].map(str).find(v => isUUID(v));
            const slugCandidate = [it.product_slug, it.slug, it.id].map(str).find(v => v && !isUUID(v) && v.length >= 2);

            return {
              product_id: uuidCandidate || null,
              product_slug: slugCandidate || null,
              quantity: Number(it.quantity ?? it.qty ?? 1),
            };
          });

          for (const it of items) {
            const hasUuid = Boolean(it.product_id && isUUID(it.product_id));
            const hasSlug = Boolean(it.product_slug && it.product_slug.length >= 2);
            if (!hasUuid && !hasSlug) {
              throw new Error('Panier invalide : identifiant produit manquant.');
            }
            if (!Number.isInteger(it.quantity) || it.quantity < 1 || it.quantity > 99) {
              throw new Error('Quantité invalide.');
            }
          }

          const resp = await fetch(`${BACKEND_URL}/create-checkout-session`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items })
          });

          if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.message || err.error || 'Erreur lors de la création de la session de paiement.');
          }

          const data = await resp.json();
          if (data.url) {
            window.location.href = data.url;
          } else {
            throw new Error('Aucune URL de redirection reçue.');
          }

        } catch (err) {
          console.error('Checkout error:', err);
          payErrorEl.textContent = err.message || 'Erreur lors du paiement.';
          payErrorEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = originalText;
        }
      };
    });
  </script>
</body>

</html>
