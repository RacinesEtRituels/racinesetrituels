<!DOCTYPE html>
<html class="light" lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réinitialiser votre mot de passe - Racines & Rituels</title>

  <!-- Meta SEO -->
  <meta name="description"
    content="Réinitialisez facilement votre mot de passe pour accéder à votre compte Racines & Rituels.">
  <meta name="robots" content="noindex, follow" />

  <!-- TailwindCSS -->
    <link rel="stylesheet" href="/public/css/tailwind.css">
  <script src="/public/js/config.js"></script>

  <!-- Polices -->
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <style>
    body {
      font-family: 'Epilogue', sans-serif;
      min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-white">
  <div class="min-h-screen flex flex-col">

    <div id="site-header"></div>

    <!-- Contenu principal -->
    <main class="flex-1 p-4 flex justify-center items-center">
      <div class="bg-white dark:bg-background-dark/30 rounded-xl p-8 w-full max-w-[420px] shadow-md">

        <h2 class="text-2xl font-bold mb-3">Réinitialiser votre mot de passe</h2>

        <p class="text-gray-700 dark:text-gray-300 leading-relaxed mb-6">
          Entrez votre adresse e-mail.
          Vous recevrez un lien pour créer un nouveau mot de passe.
        </p>

        <!-- Formulaire -->
        <label class="block mb-4">
          <span class="text-sm font-medium">Adresse e-mail</span>
          <input id="email" type="email" placeholder="votre.email@exemple.com"
            class="mt-2 w-full h-12 px-4 rounded-xl border border-gray-300 dark:border-gray-600 bg-background-light dark:bg-background-dark focus:ring-2 focus:ring-primary/50 outline-none" />
        </label>

        <!-- Bouton -->
        <button id="resetBtn"
          class="w-full h-12 rounded-xl bg-primary text-white font-bold text-lg hover:bg-primary/90 transition">
          Envoyer le lien
        </button>

        <!-- Message succès -->
        <div id="successMsg"
          class="mt-6 hidden p-3 rounded-lg bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-200 text-sm">
          ✔ Un lien de réinitialisation a été envoyé à votre adresse e-mail.
        </div>

        <!-- Message erreur -->
        <div id="errorMsg"
          class="mt-6 hidden p-3 rounded-lg bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-200 text-sm"></div>

        <div class="mt-6 text-center">
          <a href="/connexion.html" class="text-primary font-medium hover:underline">
            Retour à la connexion
          </a>
        </div>

      </div>
    </main>

    <div id="site-footer"></div>
  </div>

  <!-- SCRIPT SUPABASE -->
  <script type="module">
    import { supabase } from "/public/js/supabase.js";

    const emailInput = document.getElementById("email");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");

    document.getElementById("resetBtn").addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        errorMsg.textContent = "Veuillez entrer une adresse e-mail.";
        errorMsg.classList.remove("hidden");
        successMsg.classList.add("hidden");
        return;
      }

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/confreinimotPass.html"
      });

      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove("hidden");
        successMsg.classList.add("hidden");
      } else {
        errorMsg.classList.add("hidden");
        successMsg.classList.remove("hidden");
      }
    });
  </script>

  <script type="module" src="/public/js/header-loader.js"></script>
  <script type="module" src="/public/js/footer-loader.js"></script>

</body>

</html>
