<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion - Racines & Rituels</title>

  <!-- SEO -->
  <meta name="description" content="Connectez-vous à votre espace Racines & Rituels pour suivre vos commandes, accéder à vos conseils bien-être et gérer votre compte.">
  <meta name="robots" content="index, follow"/>

  <!-- TailwindCSS -->
    <link rel="stylesheet" href="/public/css/tailwind.css">
  <script src="/public/js/config.js"></script>

  <!-- Polices -->
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

  <style>
    body { font-family: 'Epilogue', sans-serif; }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-[#1b110e] dark:text-white">

  <div id="site-header"></div>

  <div class="h-[64px]"></div>

  <!-- 📌 CONTENU PRINCIPAL -->
  <div class="min-h-screen flex flex-col">

    <main class="flex-1">
      <div class="w-full px-4 py-8 flex justify-center">
        <div class="w-full max-w-[480px] bg-white dark:bg-background-dark/40 p-6 rounded-xl shadow-md">

          <h1 class="text-3xl font-bold text-center mb-6">Connexion à mon compte</h1>

          <!-- Email -->
          <div class="mb-5">
            <label class="block font-medium mb-1">Adresse e-mail</label>
            <input id="email" type="email" placeholder="votre.email@exemple.com"
              class="w-full h-12 px-4 rounded-xl border border-gray-300 dark:border-gray-600 bg-background-light dark:bg-background-dark focus:ring-2 focus:ring-primary focus:outline-none">
          </div>

          <!-- Mot de passe -->
          <div class="mb-5">
            <label class="block font-medium mb-1">Mot de passe</label>
            <input id="password" type="password" placeholder="Votre mot de passe"
              class="w-full h-12 px-4 rounded-xl border border-gray-300 dark:border-gray-600 bg-background-light dark:bg-background-dark focus:ring-2 focus:ring-primary focus:outline-none">
          </div>

          <!-- Lien mot de passe oublié -->
          <div class="text-right mb-6">
            <a href="/recupmotdepass.html" class="text-primary text-sm hover:underline">
              Mot de passe oublié ?
            </a>
          </div>

          <!-- Bouton connexion -->
          <button id="loginBtn" class="w-full h-12 rounded-xl bg-primary text-white font-bold hover:bg-primary/90 transition">
            Se connecter
          </button>

          <!-- Séparateur -->
          <div class="my-6 h-px bg-gray-300 dark:bg-gray-600"></div>

          <p class="text-center text-sm">
            Pas encore de compte ?
            <a href="/inscription.html" class="text-primary font-semibold hover:underline">Créer un compte</a>
          </p>

        </div>
      </div>
    </main>

  </div>

  <!-- 🌿 SCRIPT SUPABASE -->
  <script type="module">
    import { supabase } from "/public/js/supabase.js";

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Merci de remplir tous les champs.");
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        alert("Erreur : " + error.message);
      } else {
        alert("Connexion réussie !");
        window.location.href = "index.html"; // 🔥 Change si tu veux un dashboard
      }
    });
  </script>

  <script type="module" src="/public/js/header-loader.js"></script>

  <div id="site-footer"></div>
  <script type="module" src="/public/js/footer-loader.js"></script>

</body>
</html>
