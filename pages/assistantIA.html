<!DOCTYPE html>
<html class="light" lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Assistant Bien-Être – Racines & Rituels</title>
  <meta name="description" content="Votre conseiller bien-être personnalisé : plantes, rituels et conseils adaptés à votre énergie du moment." />
  <meta name="robots" content="index,follow" />

  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/public/js/tailwind-cdn-config.js"></script>

  <style>
    body {
      font-family: 'Epilogue', sans-serif;
      <script src="/public/js/config.js"></script>
      <script type="module" src="/public/js/header-loader.js"></script>
      <script type="module" src="/public/js/footer-loader.js"></script>

<body class="bg-background-light dark:bg-background-dark text-[#1b110e] dark:text-white">

  <div id="site-header"></div>

  <!-- CONTENU -->
  <main class="pt-24 max-w-2xl mx-auto px-4 pb-40">

    <h1 class="text-center text-3xl font-bold mb-6">Ton conseiller bien-être 🌿</h1>

    <!-- Chat -->
    <div id="chat" class="flex flex-col gap-6"></div>

    <!-- Zone d’écriture -->
    <div class="fixed bottom-0 left-0 right-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-gray-300 dark:border-gray-700 p-4">
      <div class="max-w-2xl mx-auto flex gap-2">
        <input id="userInput" type="text" placeholder="Poser une question..." 
          class="flex-1 h-12 px-4 rounded-xl border border-gray-400 dark:border-gray-700 bg-white dark:bg-background-dark focus:ring-2 focus:ring-primary outline-none" />

        <button onclick="sendMessage()" class="h-12 px-6 rounded-xl bg-primary text-white font-bold hover:bg-primary/90 transition">
          Envoyer
        </button>
      </div>
    </div>

  </main>

  <script src="/public/js/assistant.js"></script>
</script>
  <script type="module" src="/public/js/header-loader.js"></script>

  <div id="site-footer"></div>
  <script type="module" src="/public/js/footer-loader.js"></script>
</body>
</html>
