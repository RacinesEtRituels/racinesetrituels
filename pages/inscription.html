<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Créer un Compte - Racines & Rituels</title>

  <!-- Meta SEO -->
  <meta name="description" content="Créez votre compte Racines & Rituels pour accéder à vos commandes, vos conseils bien-être personnalisés et vos avantages exclusifs.">
  <meta name="robots" content="index, follow"/>

  <!-- TailwindCSS -->
    <link rel="stylesheet" href="/public/css/tailwind.css">
  <script src="/public/js/config.js"></script>

  <!-- Polices -->
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

  <style>
    body { font-family: 'Epilogue', sans-serif; }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-white">

  <div id="site-header"></div>

  <!-- ESPACE -->
  <div class="h-[72px]"></div>

  <!-- FORMULAIRE -->
  <main class="flex justify-center px-4 py-10">
    <div class="w-full max-w-[480px] bg-white dark:bg-background-dark/40 p-6 rounded-xl shadow-md">

      <h1 class="text-3xl font-bold text-center mb-3">Créer un compte</h1>
      <p class="text-center text-sm text-gray-600 dark:text-gray-300 mb-6">Rejoignez l’univers Racines & Rituels 🌿</p>

      <!-- MESSAGE -->
      <div id="message" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>

      <!-- PRENOM -->
      <label class="block mb-4">
        <span class="font-medium">Prénom</span>
        <input id="prenom" type="text" placeholder="Votre prénom"
          class="mt-1 w-full h-12 px-4 rounded-xl border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:ring-primary focus:ring-2 outline-none">
      </label>

      <!-- EMAIL -->
      <label class="block mb-4">
        <span class="font-medium">Adresse e-mail</span>
        <input id="email" type="email" placeholder="votre.email@exemple.com"
          class="mt-1 w-full h-12 px-4 rounded-xl border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:ring-primary focus:ring-2 outline-none">
      </label>

      <!-- PASSWORD -->
      <label class="block mb-4">
        <span class="font-medium">Mot de passe</span>
        <input id="password" type="password" placeholder="Créer un mot de passe"
          class="mt-1 w-full h-12 px-4 rounded-xl border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:ring-primary focus:ring-2 outline-none">
      </label>

      <!-- PASSWORD 2 -->
      <label class="block mb-6">
        <span class="font-medium">Confirmez le mot de passe</span>
        <input id="password2" type="password" placeholder="Répétez votre mot de passe"
          class="mt-1 w-full h-12 px-4 rounded-xl border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:ring-primary focus:ring-2 outline-none">
      </label>

      <button id="inscriptionBtn" class="w-full h-12 rounded-xl bg-primary text-white font-bold hover:bg-primary/90 transition">
        Créer mon compte
      </button>

      <div class="my-6 h-px bg-gray-300 dark:bg-gray-700"></div>

      <p class="text-center text-sm">Vous avez déjà un compte ?  
        <a href="/connexion.html" class="text-primary font-semibold hover:underline">Se connecter</a>
      </p>

    </div>
  </main>

  <!-- SCRIPT SUPABASE -->
  <script type="module">
  import { supabase } from "/public/js/supabase.js";

  const msg = document.getElementById("message");

  function showMessage(text, type = "error") {
    if (!msg) return;
    msg.textContent = text;
    msg.classList.remove("hidden");

    if (type === "error") {
      msg.className = "mb-4 p-3 rounded-xl bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300";
    } else {
      msg.className = "mb-4 p-3 rounded-xl bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300";
    }
  }

  document.getElementById("inscriptionBtn").addEventListener("click", async () => {
    const prenom = document.getElementById("prenom").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const password2 = document.getElementById("password2").value.trim();

    if (!prenom || !email || !password) {
      return showMessage("Merci de remplir tous les champs.");
    }
    if (password !== password2) {
      return showMessage("Les mots de passe ne correspondent pas.");
    }
    if (password.length < 6) {
      return showMessage("Votre mot de passe doit contenir au moins 6 caractères.");
    }

    const { error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { prenom } }
    });

    if (error) {
      return showMessage("Erreur : " + error.message);
    }

    showMessage("Compte créé ! Vérifiez votre e-mail pour confirmer votre inscription.", "success");
    setTimeout(() => {
      window.location.href = "connexion.html";
    }, 2000);
  });

</script>

<script type="module" src="/public/js/header-loader.js"></script>

  <div id="site-footer"></div>
  <script type="module" src="/public/js/footer-loader.js"></script>

</body>
</html>
